[package]
name = "thz-analyzer-rust"
version = "1.3.4"
edition = "2024"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.33.0"
rfd = "0.15.4"
realfft = "3"
calamine = { version = "0.31", default-features = false }
rust_xlsxwriter = { version = "0.90", default-features = false }
encoding_rs = "0.8"
zip = { version = "4.2", default-features = false }
quick-xml = { version = "0.38", default-features = false }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = "symbols"
